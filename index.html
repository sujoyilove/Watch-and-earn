<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskBuddy Free</title>

  <!-- Monetag -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11563642"
    data-sdk="show_11563642">
  </script>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 15px;
    }

    #balance {
      font-size: 27px;
      font-weight: bold;
      color: #16803c;
      margin: 25px 0;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .watch {
      background: #16803c;
    }

    .checkin {
      background: #e67e22;
    }

    .refer {
      background: #8e44ad;
    }

    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
      font-size: 15px;
      font-weight: bold;
    }

    .box {
      margin-top: 25px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
      text-align: left;
    }

    .box h3 {
      margin-top: 0;
      text-align: center;
    }

    .ref-link {
      padding: 10px;
      background: #eee;
      border-radius: 7px;
      font-size: 12px;
      word-break: break-all;
      margin-top: 10px;
    }

    .count {
      text-align: center;
      margin-top: 12px;
      font-size: 15px;
    }

    .status {
      font-size: 12px;
      color: #777;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 TaskBuddy Free</h1>

  <div id="balance">
    Balance: ₹0.00
  </div>

  <button
    id="watchBtn"
    class="btn watch"
    onclick="watchAd()">
    ▶️ WATCH AD
  </button>

  <button
    id="checkinBtn"
    class="btn checkin"
    onclick="dailyCheckIn()">
    📅 DAILY CHECK-IN
  </button>

  <div class="box">

    <h3>👥 Refer & Earn</h3>

    <p style="text-align:center;">
      Invite friends using your Telegram referral link.
    </p>

    <div
      id="refLink"
      class="ref-link">
      Creating referral link...
    </div>

    <button
      class="btn refer"
      onclick="copyReferral()">
      📋 COPY REFERRAL LINK
    </button>

    <div class="count">
      Total Referrals:
      <b id="refCount">0</b>
    </div>

  </div>

  <div id="message">
    Connecting to Firebase...
  </div>

  <div
    id="firebaseStatus"
    class="status">
  </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    increment,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCWHhxS5KPF_qdVDn-ZcLs7pM66feuw7VE",

    authDomain:
      "task-buddy-free.firebaseapp.com",

    projectId:
      "task-buddy-free",

    storageBucket:
      "task-buddy-free.firebasestorage.app",

    messagingSenderId:
      "573084747627",

    appId:
      "1:573084747627:web:ee9991b118faebc306ae2e",

    measurementId:
      "G-8TZ6L2LM5W"

  };


  /* =========================
     INITIALIZE FIREBASE
  ========================= */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================
     GLOBAL VARIABLES
  ========================= */

  let currentUser = null;

  let balance = 0;

  let lastCheckIn = "";

  let referralCode = "";

  let referralCount = 0;


  const watchBtn =
    document.getElementById("watchBtn");

  const checkinBtn =
    document.getElementById("checkinBtn");

  const message =
    document.getElementById("message");


  /* =========================
     TELEGRAM BOT
  ========================= */

  const TELEGRAM_BOT =
    "taskbuddyfree_bot";


  /* =========================
     TELEGRAM START PARAM
  ========================= */

  function getReferralFromTelegram() {

    try {

      const tg =
        window.Telegram?.WebApp;

      if (tg) {

        tg.ready();

        if (
          tg.initDataUnsafe &&
          tg.initDataUnsafe.start_param
        ) {

          return tg.initDataUnsafe.start_param;

        }

      }

    } catch (error) {

      console.log(
        "Telegram start parameter unavailable"
      );

    }

    return null;

  }


  /* =========================
     CREATE REFERRAL CODE
  ========================= */

  function createReferralCode() {

    return "REF" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

  }


  /* =========================
     LOAD USER
  ========================= */

  async function loadUser(user) {

    currentUser = user;

    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    const snapshot =
      await getDoc(userRef);


    if (!snapshot.exists()) {

      referralCode =
        createReferralCode();

      balance = 0;

      lastCheckIn = "";

      referralCount = 0;


      await setDoc(
        userRef,
        {

          uid:
            user.uid,

          balance:
            0,

          referralCode:
            referralCode,

          referralCount:
            0,

          lastCheckIn:
            "",

          createdAt:
            serverTimestamp()

        }
      );

    } else {

      const data =
        snapshot.data();


      balance =
        Number(data.balance || 0);

      referralCode =
        data.referralCode ||
        createReferralCode();

      referralCount =
        Number(
          data.referralCount || 0
        );

      lastCheckIn =
        data.lastCheckIn || "";

    }


    updateUI();


    document.getElementById(
      "firebaseStatus"
    ).innerText =
      "🟢 Firebase connected";


    message.innerText =
      "Ready to earn!";


    /* Check incoming referral */

    const incomingReferral =
      getReferralFromTelegram();


    if (
      incomingReferral &&
      incomingReferral !== referralCode
    ) {

      await processReferral(
        incomingReferral
      );

    }

  }


  /* =========================
     REFERRAL PROCESS
  ========================= */

  async function processReferral(
    incomingReferral
  ) {

    try {

      /*
        Prevent the same user from
        processing a referral repeatedly.
      */

      const referralUsed =
        localStorage.getItem(
          "referralUsed"
        );


      if (referralUsed) {

        return;

      }


      const usersRef =
        doc(
          db,
          "users",
          currentUser.uid
        );


      /*
        Find users by referral code
        requires a query/index in a
        production implementation.

        For now we store the incoming
        code as pending referral.
      */

      await updateDoc(
        usersRef,
        {

          referredBy:
            incomingReferral,

          referralStatus:
            "pending"

        }
      );


      localStorage.setItem(
        "referralUsed",
        "true"
      );


      message.innerText =
        "🎉 Referral detected!";

    } catch (error) {

      console.error(
        "Referral error:",
        error
      );

    }

  }


  /* =========================
     UPDATE UI
  ========================= */

  function updateUI() {

    document.getElementById(
      "balance"
    ).innerText =
      "Balance: ₹" +
      balance.toFixed(2);


    document.getElementById(
      "refCount"
    ).innerText =
      referralCount;


    const referralLink =
      "https://t.me/" +
      TELEGRAM_BOT +
      "?startapp=" +
      referralCode;


    document.getElementById(
      "refLink"
    ).innerText =
      referralLink;


    updateCheckInButton();

  }


  /* =========================
     CHECK-IN BUTTON
  ========================= */

  function updateCheckInButton() {

    const today =
      new Date().toDateString();


    if (
      lastCheckIn === today
    ) {

      checkinBtn.disabled = true;

      checkinBtn.innerText =
        "✅ CHECKED IN TODAY";

    } else {

      checkinBtn.disabled = false;

      checkinBtn.innerText =
        "📅 DAILY CHECK-IN";

    }

  }


  /* =========================
     DAILY CHECK-IN
  ========================= */

  window.dailyCheckIn =
    async function() {

      if (!currentUser) {

        message.innerText =
          "⏳ Firebase is connecting...";

        return;

      }


      const today =
        new Date().toDateString();


      if (
        lastCheckIn === today
      ) {

        message.innerText =
          "ℹ️ You already checked in today.";

        return;

      }


      /*
        TEST REWARD.

        Real money rewards should
        later be controlled server-side.
      */

      balance += 15;

      lastCheckIn =
        today;


      await updateDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {

          balance:
            balance,

          lastCheckIn:
            lastCheckIn

        }
      );


      updateUI();


      message.innerText =
        "🎉 Daily Check-in complete! ₹15.00 added.";

    };


  /* =========================
     WATCH AD
  ========================= */

  window.watchAd =
    async function() {

      if (!currentUser) {

        message.innerText =
          "⏳ Firebase is connecting...";

        return;

      }


      watchBtn.disabled = true;

      message.innerText =
        "⏳ Opening advertisement...";


      try {

        if (
          typeof show_11563642 !==
          "function"
        ) {

          throw new Error(
            "Monetag SDK not loaded"
          );

        }


        const event =
          await show_11563642({

            ymid:
              currentUser.uid,

            requestVar:
              "watch_ad"

          });


        console.log(
          "Ad event:",
          event
        );


        if (
          event &&
          event.reward_event_type ===
          "valued"
        ) {

          /*
            TEST REWARD ONLY.
            Do NOT use client-side balance
            as the final real-money system.
          */

          balance += 3;


          await updateDoc(
            doc(
              db,
              "users",
              currentUser.uid
            ),
            {

              balance:
                balance

            }
          );


          updateUI();


          message.innerText =
            "✅ Ad reward confirmed! ₹3.00 added.";

        } else {

          message.innerText =
            "ℹ️ Ad finished, but no verified reward was received.";

        }


      } catch (error) {

        console.error(
          "Ad error:",
          error
        );


        message.innerText =
          "❌ Advertisement could not be completed.";

      }


      watchBtn.disabled = false;

    };


  /* =========================
     COPY REFERRAL
  ========================= */

  window.copyReferral =
    function() {

      const link =
        document.getElementById(
          "refLink"
        ).innerText;


      navigator.clipboard
        .writeText(link)
        .then(function() {

          message.innerText =
            "📋 Telegram referral link copied!";

        })
        .catch(function() {

          message.innerText =
            "❌ Could not copy link.";

        });

    };


  /* =========================
     ANONYMOUS LOGIN
  ========================= */

  signInAnonymously(auth)
    .catch(function(error) {

      console.error(
        "Firebase Auth error:",
        error
      );


      message.innerText =
        "❌ Firebase login failed.";

    });


  /* =========================
     AUTH STATE
  ========================= */

  onAuthStateChanged(
    auth,
    function(user) {

      if (user) {

        loadUser(user);

      }

    }
  );

</script>

</body>
</html>
