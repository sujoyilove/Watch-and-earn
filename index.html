<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskBuddy Free</title>

  <!-- Monetag SDK -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11563642"
    data-sdk="show_11563642">
  </script>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 15px;
    }

    #balance {
      font-size: 27px;
      font-weight: bold;
      color: #16803c;
      margin: 25px 0;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .watch {
      background: #16803c;
    }

    .checkin {
      background: #e67e22;
    }

    .refer {
      background: #8e44ad;
    }

    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
      font-size: 15px;
      font-weight: bold;
    }

    .box {
      margin-top: 25px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 12px;
      text-align: left;
    }

    .box h3 {
      margin-top: 0;
      text-align: center;
    }

    .ref-link {
      padding: 10px;
      background: #eee;
      border-radius: 7px;
      font-size: 12px;
      word-break: break-all;
      margin-top: 10px;
    }

    .count {
      text-align: center;
      margin-top: 12px;
      font-size: 15px;
    }

    .info {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 TaskBuddy Free</h1>

  <div id="balance">
    Balance: ₹0.00
  </div>


  <!-- WATCH AD -->

  <button
    id="watchBtn"
    class="btn watch"
    onclick="watchAd()">
    ▶️ WATCH AD
  </button>


  <!-- DAILY CHECK-IN -->

  <button
    id="checkinBtn"
    class="btn checkin"
    onclick="dailyCheckIn()">
    📅 DAILY CHECK-IN
  </button>


  <!-- REFERRAL -->

  <div class="box">

    <h3>👥 Refer & Earn</h3>

    <p style="text-align:center;">
      Invite your friends using your Telegram referral link.
    </p>

    <div
      id="refLink"
      class="ref-link">
      Loading...
    </div>

    <button
      class="btn refer"
      onclick="copyReferral()">
      📋 COPY REFERRAL LINK
    </button>

    <div class="count">
      Total Referrals:
      <b id="refCount">0</b>
    </div>

  </div>


  <div id="message">
    Watch ads, check in daily and invite friends.
  </div>


  <div class="info">
    Rewards are currently in test mode.
    Secure server verification will be added later.
  </div>

</div>


<script>

  /* =========================
     BALANCE
  ========================= */

  let balance =
    parseFloat(
      localStorage.getItem("userBalance")
    ) || 0;


  /* =========================
     DAILY CHECK-IN
  ========================= */

  let lastCheckIn =
    localStorage.getItem("lastCheckIn") || "";


  /* =========================
     REFERRAL CODE
  ========================= */

  let referralCode =
    localStorage.getItem("referralCode");


  if (!referralCode) {

    referralCode =
      "REF" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    localStorage.setItem(
      "referralCode",
      referralCode
    );

  }


  let referralCount =
    parseInt(
      localStorage.getItem("referralCount")
    ) || 0;


  /* =========================
     TELEGRAM BOT
     ========================= */

  const TELEGRAM_BOT =
    "taskbuddyfree_bot";


  /* =========================
     ELEMENTS
  ========================= */

  const watchBtn =
    document.getElementById("watchBtn");

  const checkinBtn =
    document.getElementById("checkinBtn");

  const message =
    document.getElementById("message");


  /* =========================
     BALANCE UI
  ========================= */

  function updateBalance() {

    document.getElementById("balance").innerText =
      "Balance: ₹" +
      balance.toFixed(2);

  }


  updateBalance();


  /* =========================
     REFERRAL LINK
  ========================= */

  function updateReferral() {

    const link =
      "https://t.me/" +
      TELEGRAM_BOT +
      "?startapp=" +
      referralCode;


    document.getElementById("refLink").innerText =
      link;


    document.getElementById("refCount").innerText =
      referralCount;

  }


  updateReferral();


  /* =========================
     CHECK-IN BUTTON
  ========================= */

  function updateCheckInButton() {

    const today =
      new Date().toDateString();


    if (lastCheckIn === today) {

      checkinBtn.disabled = true;

      checkinBtn.innerText =
        "✅ CHECKED IN TODAY";

    } else {

      checkinBtn.disabled = false;

      checkinBtn.innerText =
        "📅 DAILY CHECK-IN";

    }

  }


  updateCheckInButton();


  /* =========================
     DAILY CHECK-IN
  ========================= */

  function dailyCheckIn() {

    const today =
      new Date().toDateString();


    if (lastCheckIn === today) {

      message.innerText =
        "ℹ️ You already checked in today.";

      return;

    }


    /* TEST REWARD */

    balance += 15;


    lastCheckIn =
      today;


    localStorage.setItem(
      "userBalance",
      balance.toFixed(2)
    );


    localStorage.setItem(
      "lastCheckIn",
      lastCheckIn
    );


    updateBalance();

    updateCheckInButton();


    message.innerText =
      "🎉 Daily Check-in complete! ₹15.00 added.";

  }


  /* =========================
     WATCH AD
  ========================= */

  async function watchAd() {

    watchBtn.disabled = true;

    message.innerText =
      "⏳ Opening advertisement...";


    try {

      if (
        typeof show_11563642 !== "function"
      ) {

        throw new Error(
          "Monetag SDK not loaded"
        );

      }


      const event =
        await show_11563642({

          ymid:
            "user-" +
            Date.now(),

          requestVar:
            "watch_ad"

        });


      console.log(
        "Monetag reward event:",
        event
      );


      if (
        event &&
        event.reward_event_type === "valued"
      ) {

        /*
          TEST REWARD ONLY.
          Real reward should later
          be verified server-side.
        */

        balance += 3;


        localStorage.setItem(
          "userBalance",
          balance.toFixed(2)
        );


        updateBalance();


        message.innerText =
          "✅ Ad reward confirmed! ₹3.00 added.";

      } else {

        message.innerText =
          "ℹ️ Ad finished, but no verified reward was received.";

      }


    } catch (error) {

      console.error(
        "Monetag error:",
        error
      );


      message.innerText =
        "❌ Advertisement could not be completed.";

    }


    watchBtn.disabled = false;

  }


  /* =========================
     COPY REFERRAL LINK
  ========================= */

  function copyReferral() {

    const link =
      document.getElementById(
        "refLink"
      ).innerText;


    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      navigator.clipboard
        .writeText(link)
        .then(function() {

          message.innerText =
            "📋 Telegram referral link copied!";

        })
        .catch(function() {

          message.innerText =
            "❌ Could not copy the link.";

        });

    } else {

      message.innerText =
        "📋 Copy this link manually: " +
        link;

    }

  }


  /* =========================
     REFERRAL DETECTION
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const ref =
    params.get("ref");


  if (ref) {

    console.log(
      "Referral detected:",
      ref
    );

  }

</script>

</body>
</html>
