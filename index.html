<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>
  <script src='//libtl.com/sdk.js' data-zone='11563642' data-sdk='show_11563642'></script>
  
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 25px;
    }

    #balance {
      font-size: 26px;
      font-weight: bold;
      margin: 20px 0;
    }

    #watchBtn {
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      background: #16803c;
      color: white;
      cursor: pointer;
    }

    #watchBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 25px;
      font-size: 18px;
      min-height: 25px;
    }

    .info {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💰 Watch & Earn</h1>

    <div id="balance">
      Balance: ₹0.00
    </div>

    <button id="watchBtn" onclick="watchAd()">
      ▶️ WATCH AD
    </button>

    <div id="message">
      Watch ads and earn rewards!
    </div>

    <div class="info">
      Watch ad and get instant rewards.
    </div>

  </div>

  <script>

    let balance = 0;

    function watchAd() {
      const button = document.getElementById("watchBtn");
      const message = document.getElementById("message");

      button.disabled = true;
      message.innerText = "⏳ Loading Ad...";

      // Monetag Ad Call
      try {
        show_11563642().then(() => {
          rewardUser();
        }).catch(() => {
          rewardUser();
        });
      } catch(e) {
        rewardUser();
      }

      function rewardUser() {
        balance += 0.10;
        document.getElementById("balance").innerText = "Balance: ₹" + balance.toFixed(2);
        message.innerText = "✅ Reward added! You earned ₹0.10";
        button.disabled = false;
      }
    }
    
  </script>

</body>
</html>
