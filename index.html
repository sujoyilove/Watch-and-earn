<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskBuddy Free</title>

  <!-- Monetag -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11563642"
    data-sdk="show_11563642">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
      background: #fff;
      padding: 22px 18px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 27px;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #balance {
      font-size: 30px;
      font-weight: bold;
      color: #16803c;
      margin: 22px 0;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    .watch {
      background: #16803c;
    }

    .checkin {
      background: #e67e22;
    }

    .refer {
      background: #8e44ad;
    }

    .withdraw {
      background: #2980b9;
    }

    .box {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid #eee;
      background: #fafafa;
      border-radius: 12px;
      text-align: left;
    }

    .box h3 {
      margin: 0 0 10px;
      text-align: center;
    }

    .ref-link {
      background: #eee;
      border-radius: 7px;
      padding: 10px;
      font-size: 12px;
      word-break: break-all;
      margin-top: 10px;
    }

    .center {
      text-align: center;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 9px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    #message {
      min-height: 25px;
      margin-top: 18px;
      font-size: 14px;
      font-weight: bold;
    }

    #firebaseStatus {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .warning {
      color: #a65d00;
    }

    .uid-box {
      background: #f0f0f0;
      padding: 8px;
      border-radius: 6px;
      font-size: 10px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 TaskBuddy</h1>

  <div class="subtitle">
    Complete tasks and earn rewards
  </div>

  <div id="balance">
    Balance: ₹0.00
  </div>


  <!-- WATCH AD -->

  <button
    id="watchBtn"
    class="btn watch">
    ▶️ WATCH AD
  </button>


  <!-- DAILY CHECK-IN -->

  <button
    id="checkinBtn"
    class="btn checkin">
    📅 DAILY CHECK-IN
  </button>


  <!-- REFERRAL -->

  <div class="box">

    <h3>👥 Refer & Earn</h3>

    <p class="center small">
      Share your Telegram Mini App referral link.
    </p>

    <div
      id="refLink"
      class="ref-link">
      Loading...
    </div>

    <button
      id="copyBtn"
      class="btn refer">
      📋 COPY REFERRAL LINK
    </button>

    <p class="center">
      Referral Code:
      <b id="refCode">---</b>
    </p>

    <p
      id="refStatus"
      class="center small">
      No referral detected.
    </p>

  </div>


  <!-- WITHDRAW -->

  <div class="box">

    <h3>🏧 Withdraw</h3>

    <p class="small center">
      Minimum withdrawal: ₹250
    </p>

    <select id="paymentMethod">

      <option value="UPI">
        UPI / GPay / PhonePe
      </option>

      <option value="Paytm">
        Paytm
      </option>

    </select>

    <input
      id="paymentDetail"
      type="text"
      placeholder="Enter UPI ID / Paytm number">

    <input
      id="withdrawAmount"
      type="number"
      min="250"
      placeholder="Enter amount">

    <button
      id="withdrawBtn"
      class="btn withdraw">
      Request Withdrawal
    </button>

    <p class="small warning">
      Withdrawal requests are subject to verification.
    </p>

  </div>


  <div id="message">
    Connecting...
  </div>

  <div id="firebaseStatus">
  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCWHhxS5KPF_qdVDn-ZcLs7pM66feuw7VE",

  authDomain:
    "task-buddy-free.firebaseapp.com",

  projectId:
    "task-buddy-free",

  storageBucket:
    "task-buddy-free.firebasestorage.app",

  messagingSenderId:
    "573084747627",

  appId:
    "1:573084747627:web:ee9991b118faebc306ae2e",

  measurementId:
    "G-8TZ6L2LM5W"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   TELEGRAM
===================================================== */

const TELEGRAM_BOT =
  "taskbuddyfree_bot";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let userData = null;

let referralCode = "";

let todayCheckin = false;


/* =====================================================
   ELEMENTS
===================================================== */

const balanceEl =
  document.getElementById("balance");

const watchBtn =
  document.getElementById("watchBtn");

const checkinBtn =
  document.getElementById("checkinBtn");

const copyBtn =
  document.getElementById("copyBtn");

const withdrawBtn =
  document.getElementById("withdrawBtn");

const message =
  document.getElementById("message");

const firebaseStatus =
  document.getElementById("firebaseStatus");

const refLinkEl =
  document.getElementById("refLink");

const refCodeEl =
  document.getElementById("refCode");

const refStatusEl =
  document.getElementById("refStatus");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

  message.innerText = text;

}


/* =====================================================
   GENERATE REFERRAL CODE
===================================================== */

function generateReferralCode() {

  return (
    "REF" +
    Math.floor(
      100000 +
      Math.random() * 900000
    )
  );

}


/* =====================================================
   GET TELEGRAM START PARAM
===================================================== */

function getStartParam() {

  try {

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      const tg =
        window.Telegram.WebApp;

      tg.ready();

      if (
        tg.initDataUnsafe &&
        tg.initDataUnsafe.start_param
      ) {

        return (
          tg.initDataUnsafe.start_param
        );

      }

    }

  } catch (error) {

    console.log(error);

  }

  return null;

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI() {

  const storedBalance =
    Number(
      userData?.balance || 0
    );


  balanceEl.innerText =
    "Balance: ₹" +
    storedBalance.toFixed(2);


  referralCode =
    userData?.referralCode ||
    referralCode;


  if (!referralCode) {

    referralCode =
      generateReferralCode();

  }


  refCodeEl.innerText =
    referralCode;


  refLinkEl.innerText =
    "https://t.me/" +
    TELEGRAM_BOT +
    "?startapp=" +
    referralCode;


  const today =
    new Date().toDateString();


  todayCheckin =
    userData?.lastCheckIn === today;


  if (todayCheckin) {

    checkinBtn.disabled = true;

    checkinBtn.innerText =
      "✅ CHECKED IN TODAY";

  } else {

    checkinBtn.disabled = false;

    checkinBtn.innerText =
      "📅 DAILY CHECK-IN";

  }

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(user) {

  currentUser = user;


  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  const snapshot =
    await getDoc(userRef);


  /*
    IMPORTANT:

    With strict Firestore rules,
    the browser cannot create or modify
    a user document.

    Therefore a new user will be shown
    as a pending account until a trusted
    backend creates the profile.
  */


  if (!snapshot.exists()) {

    userData = {

      uid:
        user.uid,

      balance:
        0,

      referralCode:
        "PENDING",

      referralCount:
        0,

      lastCheckIn:
        ""

    };


    firebaseStatus.innerText =
      "🟡 Firebase connected — profile pending";


    showMessage(
      "Account connected."
    );


    updateUI();

    return;

  }


  userData =
    snapshot.data();


  firebaseStatus.innerText =
    "🟢 Firebase connected";


  showMessage(
    "Ready!"
  );


  updateUI();


  processReferral();

}


/* =====================================================
   REFERRAL
===================================================== */

async function processReferral() {

  if (!currentUser) {
    return;
  }


  const incomingCode =
    getStartParam();


  if (!incomingCode) {

    refStatusEl.innerText =
      "No referral detected.";

    return;

  }


  if (
    incomingCode ===
    referralCode
  ) {

    refStatusEl.innerText =
      "❌ Self-referral is not allowed.";

    return;

  }


  /*
    The referral is only displayed/detected here.

    A real referral reward must be verified
    by trusted backend logic.
  */


  refStatusEl.innerText =
    "🎉 Referral detected: " +
    incomingCode;


}


/* =====================================================
   WATCH AD
===================================================== */

watchBtn.addEventListener(
  "click",
  async function() {

    watchBtn.disabled = true;


    showMessage(
      "⏳ Opening advertisement..."
    );


    try {

      if (
        typeof show_11563642 !==
        "function"
      ) {

        throw new Error(
          "Monetag SDK not loaded"
        );

      }


      const result =
        await show_11563642();


      console.log(
        "Ad result:",
        result
      );


      /*
        IMPORTANT:

        Do not credit real money here.

        Monetag reward verification must be
        handled through a trusted mechanism.
      */


      showMessage(
        "✅ Ad completed. Reward verification pending."
      );


    } catch (error) {

      console.error(
        error
      );


      showMessage(
        "❌ Advertisement failed."
      );

    }


    watchBtn.disabled = false;

  }
);


/* =====================================================
   DAILY CHECK-IN
===================================================== */

checkinBtn.addEventListener(
  "click",
  function() {

    if (!currentUser) {

      showMessage(
        "⏳ Connecting..."
      );

      return;

    }


    if (!userData) {

      showMessage(
        "⏳ Account profile is pending."
      );

      return;

    }


    if (todayCheckin) {

      showMessage(
        "✅ Already checked in today."
      );

      return;

    }


    /*
      Strict rules intentionally prevent
      client-side balance manipulation.

      Therefore this button creates no
      fake money credit.
    */


    showMessage(
      "📅 Check-in recorded as pending verification."
    );

  }
);


/* =====================================================
   COPY REFERRAL LINK
===================================================== */

copyBtn.addEventListener(
  "click",
  async function() {

    if (
      !referralCode ||
      referralCode === "PENDING"
    ) {

      showMessage(
        "Referral code is not ready yet."
      );

      return;

    }


    const link =
      "https://t.me/" +
      TELEGRAM_BOT +
      "?startapp=" +
      referralCode;


    try {

      await navigator.clipboard.writeText(
        link
      );


      showMessage(
        "📋 Telegram referral link copied!"
      );

    } catch (error) {

      showMessage(
        link
      );

    }

  }
);


/* =====================================================
   WITHDRAWAL REQUEST
===================================================== */

withdrawBtn.addEventListener(
  "click",
  async function() {

    if (!currentUser) {

      showMessage(
        "⏳ Connecting..."
      );

      return;

    }


    const method =
      document.getElementById(
        "paymentMethod"
      ).value;


    const detail =
      document.getElementById(
        "paymentDetail"
      ).value.trim();


    const amount =
      Number(
        document.getElementById(
          "withdrawAmount"
        ).value
      );


    const availableBalance =
      Number(
        userData?.balance || 0
      );


    if (!detail) {

      showMessage(
        "❌ Enter payment details."
      );

      return;

    }


    if (
      !Number.isFinite(amount) ||
      amount < 250
    ) {

      showMessage(
        "❌ Minimum withdrawal is ₹250."
      );

      return;

    }


    if (
      amount > availableBalance
    ) {

      showMessage(
        "❌ Insufficient balance."
      );

      return;

    }


    withdrawBtn.disabled = true;


    try {

      await addDoc(
        collection(
          db,
          "withdrawalRequests"
        ),
        {

          uid:
            currentUser.uid,

          amount:
            amount,

          method:
            method,

          paymentDetail:
            detail,

          status:
            "pending",

          createdAt:
            serverTimestamp()

        }
      );


      showMessage(
        "✅ Withdrawal request submitted."
      );


      document.getElementById(
        "paymentDetail"
      ).value = "";


      document.getElementById(
        "withdrawAmount"
      ).value = "";


    } catch (error) {

      console.error(
        error
      );


      showMessage(
        "❌ Withdrawal request failed."
      );

    }


    withdrawBtn.disabled = false;

  }
);


/* =====================================================
   ANONYMOUS AUTH
===================================================== */

signInAnonymously(auth)

  .catch(
    function(error) {

      console.error(
        error
      );


      firebaseStatus.innerText =
        "🔴 Firebase authentication failed";


      showMessage(
        "❌ Firebase authentication failed."
      );

    }
  );


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  function(user) {

    if (!user) {
      return;
    }


    loadUser(user)
      .catch(
        function(error) {

          console.error(
            error
          );


          firebaseStatus.innerText =
            "🔴 Could not load Firebase profile";


          showMessage(
            "❌ Could not load account."
          );

        }
      );

  }
);

</script>

</body>
</html>
