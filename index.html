<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskBuddy Free</title>

  <!-- Monetag SDK -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11563642"
    data-sdk="show_11563642">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
      background: #fff;
      padding: 22px 18px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    h1 {
      margin: 5px 0 8px;
      font-size: 27px;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #balance {
      font-size: 30px;
      font-weight: bold;
      color: #16803c;
      margin: 22px 0;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    .watch {
      background: #16803c;
    }

    .checkin {
      background: #e67e22;
    }

    .refer {
      background: #8e44ad;
    }

    .withdraw {
      background: #2980b9;
    }

    .box {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid #eee;
      background: #fafafa;
      border-radius: 12px;
      text-align: left;
    }

    .box h3 {
      margin: 0 0 10px;
      text-align: center;
    }

    .ref-link {
      background: #eee;
      border-radius: 7px;
      padding: 10px;
      font-size: 12px;
      word-break: break-all;
      margin-top: 10px;
    }

    .center {
      text-align: center;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 9px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    #message {
      min-height: 25px;
      margin-top: 18px;
      font-size: 14px;
      font-weight: bold;
    }

    #firebaseStatus {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .small {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .warning {
      color: #a65d00;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 TaskBuddy</h1>

  <div class="subtitle">
    Complete tasks and earn rewards
  </div>

  <div id="balance">
    Balance: ₹0.00
  </div>


  <!-- WATCH AD -->

  <button
    id="watchBtn"
    class="btn watch">
    ▶️ WATCH AD
  </button>


  <!-- DAILY CHECK-IN -->

  <button
    id="checkinBtn"
    class="btn checkin">
    📅 DAILY CHECK-IN — ₹15
  </button>


  <!-- REFERRAL -->

  <div class="box">

    <h3>👥 Refer & Earn</h3>

    <p class="center small">
      Share your Telegram Mini App referral link.
    </p>

    <div
      id="refLink"
      class="ref-link">
      Loading...
    </div>

    <button
      id="copyBtn"
      class="btn refer">
      📋 COPY REFERRAL LINK
    </button>

    <p class="center">
      Total Referrals:
      <b id="refCount">0</b>
    </p>

    <p
      id="refStatus"
      class="center small">
      No referral detected.
    </p>

  </div>


  <!-- WITHDRAW -->

  <div class="box">

    <h3>🏧 Withdraw</h3>

    <p class="small center">
      Minimum withdrawal: ₹250
    </p>

    <select id="paymentMethod">
      <option value="UPI">
        UPI / GPay / PhonePe
      </option>

      <option value="Paytm">
        Paytm
      </option>
    </select>

    <input
      id="paymentDetail"
      type="text"
      placeholder="Enter UPI ID / Paytm number">

    <input
      id="withdrawAmount"
      type="number"
      min="250"
      placeholder="Amount">

    <button
      id="withdrawBtn"
      class="btn withdraw">
      Request Withdrawal
    </button>

    <p class="small warning">
      Withdrawal requests require manual verification.
    </p>

  </div>


  <div id="message">
    Connecting...
  </div>

  <div id="firebaseStatus">
  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCWHhxS5KPF_qdVDn-ZcLs7pM66feuw7VE",

  authDomain:
    "task-buddy-free.firebaseapp.com",

  projectId:
    "task-buddy-free",

  storageBucket:
    "task-buddy-free.firebasestorage.app",

  messagingSenderId:
    "573084747627",

  appId:
    "1:573084747627:web:ee9991b118faebc306ae2e",

  measurementId:
    "G-8TZ6L2LM5W"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let balance = 0;

let referralCode = "";

let referralCount = 0;

let lastCheckIn = "";

let referralProcessed = false;


/* =====================================================
   ELEMENTS
===================================================== */

const balanceEl =
  document.getElementById("balance");

const watchBtn =
  document.getElementById("watchBtn");

const checkinBtn =
  document.getElementById("checkinBtn");

const copyBtn =
  document.getElementById("copyBtn");

const withdrawBtn =
  document.getElementById("withdrawBtn");

const message =
  document.getElementById("message");

const refLinkEl =
  document.getElementById("refLink");

const refCountEl =
  document.getElementById("refCount");

const refStatusEl =
  document.getElementById("refStatus");

const firebaseStatus =
  document.getElementById("firebaseStatus");


/* =====================================================
   TELEGRAM BOT
===================================================== */

const TELEGRAM_BOT =
  "taskbuddyfree_bot";


/* =====================================================
   UI
===================================================== */

function updateUI() {

  balanceEl.innerText =
    "Balance: ₹" +
    balance.toFixed(2);


  refCountEl.innerText =
    referralCount;


  refLinkEl.innerText =
    "https://t.me/" +
    TELEGRAM_BOT +
    "?startapp=" +
    referralCode;


  const today =
    new Date().toDateString();


  if (lastCheckIn === today) {

    checkinBtn.disabled = true;

    checkinBtn.innerText =
      "✅ CHECKED IN TODAY";

  } else {

    checkinBtn.disabled = false;

    checkinBtn.innerText =
      "📅 DAILY CHECK-IN — ₹15";

  }

}


/* =====================================================
   GENERATE REFERRAL CODE
===================================================== */

function generateReferralCode() {

  return (
    "REF" +
    Math.floor(
      100000 +
      Math.random() * 900000
    )
  );

}


/* =====================================================
   TELEGRAM START PARAM
===================================================== */

function getStartParam() {

  try {

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      const tg =
        window.Telegram.WebApp;

      tg.ready();


      if (
        tg.initDataUnsafe &&
        tg.initDataUnsafe.start_param
      ) {

        return tg.initDataUnsafe.start_param;

      }

    }

  } catch (error) {

    console.log(error);

  }

  return null;

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(user) {

  currentUser = user;


  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  const snapshot =
    await getDoc(userRef);


  if (!snapshot.exists()) {

    referralCode =
      generateReferralCode();


    await setDoc(
      userRef,
      {

        uid:
          user.uid,

        balance:
          0,

        referralCode:
          referralCode,

        referralCount:
          0,

        lastCheckIn:
          "",

        createdAt:
          serverTimestamp()

      }
    );


    balance = 0;

    referralCount = 0;

    lastCheckIn = "";

  } else {

    const data =
      snapshot.data();


    balance =
      Number(
        data.balance || 0
      );


    referralCode =
      data.referralCode ||
      generateReferralCode();


    referralCount =
      Number(
        data.referralCount || 0
      );


    lastCheckIn =
      data.lastCheckIn || "";

  }


  updateUI();


  firebaseStatus.innerText =
    "🟢 Firebase connected";


  message.innerText =
    "Ready!";


  await processReferral();

}


/* =====================================================
   REFERRAL DETECTION
===================================================== */

async function processReferral() {

  if (!currentUser) {
    return;
  }


  if (referralProcessed) {
    return;
  }


  const incomingCode =
    getStartParam();


  if (!incomingCode) {
    return;
  }


  if (
    incomingCode ===
    referralCode
  ) {

    refStatusEl.innerText =
      "❌ Self-referral is not allowed.";

    return;

  }


  const userRef =
    doc(
      db,
      "users",
      currentUser.uid
    );


  const snapshot =
    await getDoc(userRef);


  if (!snapshot.exists()) {
    return;
  }


  const data =
    snapshot.data();


  /*
    A referral can only be attached once.
  */

  if (data.referredBy) {

    refStatusEl.innerText =
      "Referral already registered.";

    referralProcessed = true;

    return;

  }


  await updateDoc(
    userRef,
    {

      referredBy:
        incomingCode,

      referralStatus:
        "pending",

      referralDetectedAt:
        serverTimestamp()

    }
  );


  refStatusEl.innerText =
    "🎉 Referral detected!";

  referralProcessed = true;

}


/* =====================================================
   DAILY CHECK-IN
===================================================== */

checkinBtn.addEventListener(
  "click",
  async function() {

    if (!currentUser) {

      message.innerText =
        "⏳ Please wait...";

      return;

    }


    const today =
      new Date().toDateString();


    if (
      lastCheckIn === today
    ) {

      message.innerText =
        "You already checked in today.";

      return;

    }


    /*
      NOTE:
      This is a client-side demo reward.
      Do not treat it as secure real-money credit.
    */

    balance += 15;

    lastCheckIn =
      today;


    await updateDoc(
      doc(
        db,
        "users",
        currentUser.uid
      ),
      {

        balance:
          balance,

        lastCheckIn:
          lastCheckIn

      }
    );


    updateUI();


    message.innerText =
      "🎉 Daily check-in completed.";

  }
);


/* =====================================================
   WATCH AD
===================================================== */

watchBtn.addEventListener(
  "click",
  async function() {

    if (!currentUser) {

      message.innerText =
        "⏳ Please wait...";

      return;

    }


    watchBtn.disabled = true;


    message.innerText =
      "⏳ Opening advertisement...";


    try {

      if (
        typeof show_11563642 !==
        "function"
      ) {

        throw new Error(
          "Advertisement SDK not loaded."
        );

      }


      const result =
        await show_11563642();


      console.log(
        "Ad result:",
        result
      );


      /*
        Do NOT automatically credit real money
        just because the ad function returned.

        A real reward system needs the ad network's
        verified reward callback/server verification.
      */


      message.innerText =
        "✅ Ad completed. Reward verification pending.";


    } catch (error) {

      console.error(
        error
      );


      message.innerText =
        "❌ Advertisement failed.";

    }


    watchBtn.disabled = false;

  }
);


/* =====================================================
   COPY REFERRAL
===================================================== */

copyBtn.addEventListener(
  "click",
  async function() {

    const link =
      "https://t.me/" +
      TELEGRAM_BOT +
      "?startapp=" +
      referralCode;


    try {

      await navigator.clipboard.writeText(
        link
      );


      message.innerText =
        "📋 Telegram referral link copied!";

    } catch (error) {

      message.innerText =
        link;

    }

  }
);


/* =====================================================
   WITHDRAWAL REQUEST
===================================================== */

withdrawBtn.addEventListener(
  "click",
  async function() {

    if (!currentUser) {

      message.innerText =
        "⏳ Please wait...";

      return;

    }


    const method =
      document.getElementById(
        "paymentMethod"
      ).value;


    const detail =
      document.getElementById(
        "paymentDetail"
      ).value.trim();


    const amount =
      Number(
        document.getElementById(
          "withdrawAmount"
        ).value
      );


    if (!detail) {

      message.innerText =
        "❌ Enter your payment details.";

      return;

    }


    if (
      !Number.isFinite(amount) ||
      amount < 250
    ) {

      message.innerText =
        "❌ Minimum withdrawal is ₹250.";

      return;

    }


    if (amount > balance) {

      message.innerText =
        "❌ Insufficient balance.";

      return;

    }


    withdrawBtn.disabled = true;


    try {

      /*
        Create a withdrawal request.

        IMPORTANT:
        We do NOT send a Telegram bot token
        from the browser.
      */

      await addDoc(
        collection(
          db,
          "withdrawalRequests"
        ),
        {

          uid:
            currentUser.uid,

          referralCode:
            referralCode,

          amount:
            amount,

          method:
            method,

          paymentDetail:
            detail,

          status:
            "pending",

          createdAt:
            serverTimestamp()

        }
      );


      message.innerText =
        "✅ Withdrawal request submitted for verification.";


      document.getElementById(
        "paymentDetail"
      ).value = "";


      document.getElementById(
        "withdrawAmount"
      ).value = "";


    } catch (error) {

      console.error(
        error
      );


      message.innerText =
        "❌ Could not submit withdrawal request.";

    }


    withdrawBtn.disabled = false;

  }
);


/* =====================================================
   ANONYMOUS AUTH
===================================================== */

signInAnonymously(auth)

  .catch(
    function(error) {

      console.error(
        "Firebase Auth error:",
        error
      );


      firebaseStatus.innerText =
        "🔴 Firebase login failed";


      message.innerText =
        "❌ Firebase authentication failed.";

    }
  );


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  function(user) {

    if (!user) {
      return;
    }


    loadUser(user)
      .catch(
        function(error) {

          console.error(
            "User loading error:",
            error
          );


          message.innerText =
            "❌ Could not load user.";

        }
      );

  }
);

</script>

</body>
</html>
