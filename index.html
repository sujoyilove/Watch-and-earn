<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>

  <script src="//libtl.com/sdk.js"
          data-zone="11563642"
          data-sdk="show_11563642"></script>

  <style>
    body {
      margin: 0;
      padding: 40px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
    }

    #balance {
      font-size: 26px;
      font-weight: bold;
      color: #16803c;
      margin: 25px 0;
    }

    #watchBtn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #16803c;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #watchBtn:disabled {
      background: #999;
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 Watch & Earn</h1>

  <div id="balance">
    Balance: ₹0.00
  </div>

  <button id="watchBtn" onclick="watchAd()">
    ▶️ WATCH AD
  </button>

  <div id="message">
    Watch an ad and earn!
  </div>

</div>

<script>

let balance =
  parseFloat(localStorage.getItem("userBalance")) || 0;

const watchBtn =
  document.getElementById("watchBtn");

const message =
  document.getElementById("message");

function updateBalance() {

  document.getElementById("balance").innerText =
    "Balance: ₹" + balance.toFixed(2);

}

updateBalance();


async function watchAd() {

  watchBtn.disabled = true;

  message.innerText =
    "⏳ Opening ad...";

  try {

    if (typeof show_11563642 !== "function") {
      throw new Error("SDK not loaded");
    }

    await show_11563642();

    /*
      TEST REWARD ONLY.
      This proves that the ad flow can return
      to your page and update the balance.
    */

    balance += 0.10;

    localStorage.setItem(
      "userBalance",
      balance.toFixed(2)
    );

    updateBalance();

    message.innerText =
      "✅ Test reward added: ₹0.10";

  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ Ad could not be completed.";

  }

  watchBtn.disabled = false;

}

</script>

</body>
</html>
