<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskBuddy Free</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script src="//libtl.com/sdk.js" data-zone="11563642" data-sdk="show_11563642"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      background: var(--tg-theme-secondary-bg-color, #fff);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 18px;
    }

    #balance {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      color: #16a34a;
      margin: 16px 0 20px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active { opacity: 0.85; }
    .btn:disabled {
      background: #9ca3af !important;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .watch { background: #16a34a; }
    .checkin { background: #ea580c; }
    .refer { background: #7c3aed; }
    .withdraw { background: #2563eb; }

    .box {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .box h3 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .ref-link {
      background: #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      word-break: break-all;
      margin: 10px 0;
      text-align: center;
    }

    .center { text-align: center; }
    .small { font-size: 12px; color: #64748b; line-height: 1.5; }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: white;
    }

    #message {
      text-align: center;
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    #firebaseStatus {
      text-align: center;
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
    }

    .warning { color: #b45309; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>💰 TaskBuddy</h1>
  <div class="subtitle">Complete tasks and earn rewards</div>

  <div id="balance">Balance: ₹0.00</div>

  <button id="watchBtn" class="btn watch">▶️ WATCH AD (+₹1.00)</button>
  <button id="checkinBtn" class="btn checkin">📅 DAILY CHECK-IN (+₹10.00)</button>

  <!-- Referral -->
  <div class="box">
    <h3>👥 Refer & Earn</h3>
    <p class="center small">Share your link and earn when friends join</p>
    <div id="refLink" class="ref-link">Loading...</div>
    <button id="copyBtn" class="btn refer">📋 COPY REFERRAL LINK</button>
    <p class="center" style="margin-top:10px;">
      Your Code: <b id="refCode">---</b>
    </p>
    <p id="refStatus" class="center small">No referral detected.</p>
  </div>

  <!-- Withdraw -->
  <div class="box">
    <h3>🏧 Withdraw</h3>
    <p class="small center">Minimum withdrawal: ₹250</p>

    <select id="paymentMethod">
      <option value="UPI">UPI / GPay / PhonePe</option>
      <option value="Paytm">Paytm</option>
    </select>

    <input id="paymentDetail" type="text" placeholder="Enter UPI ID / Paytm number">
    <input id="withdrawAmount" type="number" min="250" placeholder="Enter amount (min 250)">

    <button id="withdrawBtn" class="btn withdraw">Request Withdrawal</button>
    <p class="small warning center">Withdrawal requests are subject to verification.</p>
  </div>

  <div id="message">Connecting...</div>
  <div id="firebaseStatus"></div>
</div>

<script type="module">
/* ===================== FIREBASE ===================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  collection, addDoc, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCWHhxS5KPF_qdVDn-ZcLs7pM66feuw7VE",
  authDomain: "task-buddy-free.firebaseapp.com",
  projectId: "task-buddy-free",
  storageBucket: "task-buddy-free.firebasestorage.app",
  messagingSenderId: "573084747627",
  appId: "1:573084747627:web:ee9991b118faebc306ae2e",
  measurementId: "G-8TZ6L2LM5W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===================== TELEGRAM ===================== */
const TELEGRAM_BOT = "taskbuddyfree_bot";
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  document.body.style.background = tg.themeParams.bg_color || "#f5f5f5";
}

/* ===================== STATE ===================== */
let currentUser = null;
let userData = null;
let referralCode = "";
let todayCheckin = false;

/* ===================== ELEMENTS ===================== */
const balanceEl = document.getElementById("balance");
const watchBtn = document.getElementById("watchBtn");
const checkinBtn = document.getElementById("checkinBtn");
const copyBtn = document.getElementById("copyBtn");
const withdrawBtn = document.getElementById("withdrawBtn");
const message = document.getElementById("message");
const firebaseStatus = document.getElementById("firebaseStatus");
const refLinkEl = document.getElementById("refLink");
const refCodeEl = document.getElementById("refCode");
const refStatusEl = document.getElementById("refStatus");

function showMessage(text) {
  message.innerText = text;
}

function generateReferralCode() {
  return "REF" + Math.floor(100000 + Math.random() * 900000);
}

function getStartParam() {
  try {
    if (tg?.initDataUnsafe?.start_param) {
      return tg.initDataUnsafe.start_param;
    }
  } catch (e) {}
  return null;
}

/* ===================== UI UPDATE ===================== */
function updateUI() {
  const bal = Number(userData?.balance || 0);
  balanceEl.innerText = "Balance: ₹" + bal.toFixed(2);

  referralCode = userData?.referralCode || referralCode;
  if (!referralCode || referralCode === "PENDING") {
    referralCode = generateReferralCode();
  }

  refCodeEl.innerText = referralCode;
  refLinkEl.innerText = `https://t.me/\( {TELEGRAM_BOT}?startapp= \){referralCode}`;

  const today = new Date().toDateString();
  todayCheckin = userData?.lastCheckIn === today;

  if (todayCheckin) {
    checkinBtn.disabled = true;
    checkinBtn.innerText = "✅ CHECKED IN TODAY";
  } else {
    checkinBtn.disabled = false;
    checkinBtn.innerText = "📅 DAILY CHECK-IN (+₹10.00)";
  }
}

/* ===================== LOAD / CREATE USER ===================== */
async function loadUser(user) {
  currentUser = user;
  const userRef = doc(db, "users", user.uid);
  const snapshot = await getDoc(userRef);

  if (!snapshot.exists()) {
    const newCode = generateReferralCode();
    const newUser = {
      uid: user.uid,
      balance: 0,
      referralCode: newCode,
      referralCount: 0,
      lastCheckIn: "",
      createdAt: serverTimestamp(),
      referredBy: null
    };

    await setDoc(userRef, newUser);
    userData = newUser;
    referralCode = newCode;

    firebaseStatus.innerText = "🟢 New account created";
    showMessage("Welcome! Account created.");
  } else {
    userData = snapshot.data();
    firebaseStatus.innerText = "🟢 Firebase connected";
    showMessage("Ready!");
  }

  updateUI();
  await processReferral();
}

/* ===================== REFERRAL ===================== */
async function processReferral() {
  if (!currentUser || !userData) return;

  const incomingCode = getStartParam();
  if (!incomingCode) {
    refStatusEl.innerText = "No referral detected.";
    return;
  }

  if (incomingCode === userData.referralCode) {
    refStatusEl.innerText = "❌ Self-referral not allowed.";
    return;
  }

  if (userData.referredBy) {
    refStatusEl.innerText = "Already referred by someone.";
    return;
  }

  try {
    const userRef = doc(db, "users", currentUser.uid);
    await updateDoc(userRef, {
      referredBy: incomingCode
    });

    refStatusEl.innerText = "🎉 Referral applied: " + incomingCode;
    userData.referredBy = incomingCode;
  } catch (err) {
    console.error(err);
    refStatusEl.innerText = "Referral detected: " + incomingCode;
  }
}

/* ===================== WATCH AD ===================== */
watchBtn.addEventListener("click", async () => {
  if (!currentUser || !userData) {
    showMessage("⏳ Please wait, connecting...");
    return;
  }

  watchBtn.disabled = true;
  showMessage("⏳ Opening advertisement...");

  try {
    if (typeof show_11563642 !== "function") {
      throw new Error("Monetag SDK not loaded");
    }

    const result = await show_11563642();
    console.log("Ad result:", result);

    // অ্যাড রিওয়ার্ড = ১ টাকা
    const reward = 1.00;
    const userRef = doc(db, "users", currentUser.uid);

    await updateDoc(userRef, {
      balance: increment(reward)
    });

    userData.balance = (userData.balance || 0) + reward;
    updateUI();
    showMessage(`✅ Ad completed! +₹${reward.toFixed(2)} added`);

  } catch (error) {
    console.error(error);
    showMessage("❌ Advertisement failed or closed.");
  }

  watchBtn.disabled = false;
});

/* ===================== DAILY CHECK-IN ===================== */
checkinBtn.addEventListener("click", async () => {
  if (!currentUser || !userData) {
    showMessage("⏳ Connecting...");
    return;
  }

  if (todayCheckin) {
    showMessage("✅ Already checked in today.");
    return;
  }

  checkinBtn.disabled = true;
  showMessage("⏳ Processing check-in...");

  try {
    const today = new Date().toDateString();
    // Daily Check-in রিওয়ার্ড = ১০ টাকা
    const reward = 10.00;
    const userRef = doc(db, "users", currentUser.uid);

    await updateDoc(userRef, {
      balance: increment(reward),
      lastCheckIn: today
    });

    userData.balance = (userData.balance || 0) + reward;
    userData.lastCheckIn = today;
    todayCheckin = true;

    updateUI();
    showMessage(`✅ Check-in successful! +₹${reward.toFixed(2)}`);
  } catch (error) {
    console.error(error);
    showMessage("❌ Check-in failed.");
    checkinBtn.disabled = false;
  }
});

/* ===================== COPY REFERRAL ===================== */
copyBtn.addEventListener("click", async () => {
  if (!referralCode) {
    showMessage("Referral code not ready.");
    return;
  }

  const link = `https://t.me/\( {TELEGRAM_BOT}?startapp= \){referralCode}`;

  try {
    await navigator.clipboard.writeText(link);
    showMessage("📋 Referral link copied!");
  } catch (e) {
    showMessage(link);
  }
});

/* ===================== WITHDRAW ===================== */
withdrawBtn.addEventListener("click", async () => {
  if (!currentUser || !userData) {
    showMessage("⏳ Connecting...");
    return;
  }

  const method = document.getElementById("paymentMethod").value;
  const detail = document.getElementById("paymentDetail").value.trim();
  const amount = Number(document.getElementById("withdrawAmount").value);
  const available = Number(userData.balance || 0);

  if (!detail) {
    showMessage("❌ Enter payment details.");
    return;
  }
  if (!Number.isFinite(amount) || amount < 250) {
    showMessage("❌ Minimum withdrawal is ₹250.");
    return;
  }
  if (amount > available) {
    showMessage("❌ Insufficient balance.");
    return;
  }

  withdrawBtn.disabled = true;
  showMessage("⏳ Submitting request...");

  try {
    await addDoc(collection(db, "withdrawalRequests"), {
      uid: currentUser.uid,
      amount: amount,
      method: method,
      paymentDetail: detail,
      status: "pending",
      createdAt: serverTimestamp()
    });

    const userRef = doc(db, "users", currentUser.uid);
    await updateDoc(userRef, {
      balance: increment(-amount)
    });

    userData.balance = available - amount;
    updateUI();

    document.getElementById("paymentDetail").value = "";
    document.getElementById("withdrawAmount").value = "";
    showMessage("✅ Withdrawal request submitted!");
  } catch (error) {
    console.error(error);
    showMessage("❌ Withdrawal request failed.");
  }

  withdrawBtn.disabled = false;
});

/* ===================== AUTH ===================== */
signInAnonymously(auth).catch((error) => {
  console.error(error);
  firebaseStatus.innerText = "🔴 Auth failed";
  showMessage("❌ Firebase authentication failed.");
});

onAuthStateChanged(auth, (user) => {
  if (!user) return;

  loadUser(user).catch((error) => {
    console.error(error);
    firebaseStatus.innerText = "🔴 Profile load failed";
    showMessage("❌ Could not load account.");
  });
});
</script>
</body>
</html>
