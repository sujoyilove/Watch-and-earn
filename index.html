<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskBuddy</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script src="//libtl.com/sdk.js" data-zone="11563642" data-sdk="show_11563642"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f0f2f5;
      padding: 16px;
      min-height: 100vh;
      color: #1a1a1a;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }
    #balance {
      text-align: center;
      font-size: 34px;
      font-weight: 700;
      color: #16a34a;
      margin: 18px 0 22px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 11px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled {
      background: #9ca3af !important;
      cursor: not-allowed;
      opacity: 0.75;
    }
    .watch { background: #16a34a; }
    .checkin { background: #ea580c; }
    .refer { background: #7c3aed; }
    .withdraw { background: #2563eb; }
    .box {
      margin-top: 22px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .box h3 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .ref-link {
      background: #e2e8f0;
      border-radius: 8px;
      padding: 11px;
      font-size: 12px;
      word-break: break-all;
      margin: 10px 0;
      text-align: center;
      color: #334155;
    }
    .center { text-align: center; }
    .small { font-size: 12px; color: #64748b; line-height: 1.5; }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 9px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: white;
    }
    #message {
      text-align: center;
      min-height: 24px;
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }
    #status {
      text-align: center;
      margin-top: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .warning { color: #b45309; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h1>💰 TaskBuddy</h1>
  <div class="subtitle">Complete tasks and earn rewards</div>

  <div id="balance">Balance: ₹0.00</div>

  <button id="watchBtn" class="btn watch">▶️ WATCH AD (+₹1.00)</button>
  <button id="checkinBtn" class="btn checkin">📅 DAILY CHECK-IN (+₹10.00)</button>

  <!-- Referral Box -->
  <div class="box">
    <h3>👥 Refer & Earn</h3>
    <p class="center small">Share your link and earn when friends join</p>
    <div id="refLink" class="ref-link">Loading...</div>
    <button id="copyBtn" class="btn refer">📋 COPY REFERRAL LINK</button>
    <p class="center" style="margin-top:12px;">
      Your Code: <b id="refCode">---</b>
    </p>
    <p id="refStatus" class="center small">No referral detected.</p>
  </div>

  <!-- Withdraw Box -->
  <div class="box">
    <h3>🏧 Withdraw</h3>
    <p class="small center">Minimum withdrawal: ₹250</p>

    <select id="paymentMethod">
      <option value="UPI">UPI / GPay / PhonePe</option>
      <option value="Paytm">Paytm</option>
    </select>

    <input id="paymentDetail" type="text" placeholder="Enter UPI ID / Paytm number">
    <input id="withdrawAmount" type="number" min="250" placeholder="Enter amount (min 250)">

    <button id="withdrawBtn" class="btn withdraw">Request Withdrawal</button>
    <p class="warning center">Withdrawal requests are subject to verification.</p>
  </div>

  <div id="message">Connecting...</div>
  <div id="status"></div>
</div>

<script type="module">
  // ===================== FIREBASE =====================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, updateDoc,
    collection, addDoc, serverTimestamp, increment
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWHhxS5KPF_qdVDn-ZcLs7pM66feuw7VE",
    authDomain: "task-buddy-free.firebaseapp.com",
    projectId: "task-buddy-free",
    storageBucket: "task-buddy-free.firebasestorage.app",
    messagingSenderId: "573084747627",
    appId: "1:573084747627:web:ee9991b118faebc306ae2e",
    measurementId: "G-8TZ6L2LM5W"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ===================== TELEGRAM =====================
  const BOT_USERNAME = "taskbuddyfree_bot";
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ===================== STATE =====================
  let currentUser = null;
  let userData = null;
  let isBusy = false;

  // ===================== ELEMENTS =====================
  const balanceEl   = document.getElementById("balance");
  const watchBtn    = document.getElementById("watchBtn");
  const checkinBtn  = document.getElementById("checkinBtn");
  const copyBtn     = document.getElementById("copyBtn");
  const withdrawBtn = document.getElementById("withdrawBtn");
  const messageEl   = document.getElementById("message");
  const statusEl    = document.getElementById("status");
  const refLinkEl   = document.getElementById("refLink");
  const refCodeEl   = document.getElementById("refCode");
  const refStatusEl = document.getElementById("refStatus");

  function showMsg(text) {
    messageEl.innerText = text;
  }

  function generateCode() {
    return "REF" + Math.floor(100000 + Math.random() * 900000);
  }

  function getStartParam() {
    try {
      return tg?.initDataUnsafe?.start_param || null;
    } catch (e) {
      return null;
    }
  }

  // ===================== UI UPDATE =====================
  function updateUI() {
    if (!userData) return;

    const bal = Number(userData.balance || 0);
    balanceEl.innerText = "Balance: ₹" + bal.toFixed(2);

    const code = userData.referralCode || "---";
    refCodeEl.innerText = code;
    refLinkEl.innerText = "https://t.me/" + BOT_USERNAME + "?startapp=" + code;

    const today = new Date().toDateString();
    const alreadyChecked = userData.lastCheckIn === today;

    if (alreadyChecked) {
      checkinBtn.disabled = true;
      checkinBtn.innerText = "✅ CHECKED IN TODAY";
    } else {
      checkinBtn.disabled = false;
      checkinBtn.innerText = "📅 DAILY CHECK-IN (+₹10.00)";
    }
  }

  // ===================== LOAD USER =====================
  async function loadUser(user) {
    if (isBusy) return;
    isBusy = true;

    try {
      currentUser = user;
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);

      if (!snap.exists()) {
        // নতুন ইউজার
        const newCode = generateCode();
        const data = {
          uid: user.uid,
          balance: 0,
          referralCode: newCode,
          lastCheckIn: "",
          referredBy: null,
          createdAt: serverTimestamp()
        };
        await setDoc(userRef, data);
        userData = data;
        statusEl.innerText = "🟢 New account created";
        showMsg("Welcome! Account created.");
      } else {
        // পুরনো ইউজার
        userData = snap.data();
        statusEl.innerText = "🟢 Connected";
        showMsg("Ready!");
      }

      updateUI();
      handleReferral();
    } catch (err) {
      console.error(err);
      statusEl.innerText = "🔴 Error loading profile";
      showMsg("❌ " + (err.message || "Could not load account"));
    } finally {
      isBusy = false;
    }
  }

  // ===================== REFERRAL =====================
  async function handleReferral() {
    if (!currentUser || !userData) return;

    const code = getStartParam();
    if (!code) {
      refStatusEl.innerText = "No referral detected.";
      return;
    }

    if (code === userData.referralCode) {
      refStatusEl.innerText = "❌ Self-referral not allowed.";
      return;
    }

    if (userData.referredBy) {
      refStatusEl.innerText = "Already referred.";
      return;
    }

    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        referredBy: code
      });
      userData.referredBy = code;
      refStatusEl.innerText = "🎉 Referral applied: " + code;
    } catch (e) {
      refStatusEl.innerText = "Referral detected: " + code;
    }
  }

  // ===================== WATCH AD =====================
  watchBtn.addEventListener("click", async () => {
    if (!currentUser || !userData) {
      showMsg("⏳ Please wait...");
      return;
    }

    watchBtn.disabled = true;
    showMsg("⏳ Opening ad...");

    try {
      if (typeof show_11563642 !== "function") {
        throw new Error("Ad SDK not loaded");
      }

      await show_11563642({
        ymid: currentUser.uid + "_" + Date.now()
      });

      // সফল হলে ১ টাকা যোগ
      await updateDoc(doc(db, "users", currentUser.uid), {
        balance: increment(1)
      });

      userData.balance = (Number(userData.balance) || 0) + 1;
      updateUI();
      showMsg("✅ Ad completed! +₹1.00");
    } catch (err) {
      console.error(err);
      let msg = "❌ Ad failed or closed";
      if (err?.message) {
        const m = err.message.toLowerCase();
        if (m.includes("feed") || m.includes("empty") || m.includes("no ad")) {
          msg = "❌ No ads available now. Try later.";
        } else if (m.includes("timeout")) {
          msg = "❌ Ad timed out";
        }
      }
      showMsg(msg);
    }

    watchBtn.disabled = false;
  });

  // ===================== DAILY CHECK-IN =====================
  checkinBtn.addEventListener("click", async () => {
    if (!currentUser || !userData) {
      showMsg("⏳ Please wait...");
      return;
    }

    const today = new Date().toDateString();
    if (userData.lastCheckIn === today) {
      showMsg("✅ Already checked in today");
      return;
    }

    checkinBtn.disabled = true;
    showMsg("⏳ Processing...");

    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        balance: increment(10),
        lastCheckIn: today
      });

      userData.balance = (Number(userData.balance) || 0) + 10;
      userData.lastCheckIn = today;
      updateUI();
      showMsg("✅ Check-in successful! +₹10.00");
    } catch (err) {
      console.error(err);
      showMsg("❌ Check-in failed: " + (err.message || ""));
      checkinBtn.disabled = false;
    }
  });

  // ===================== COPY LINK =====================
  copyBtn.addEventListener("click", async () => {
    if (!userData?.referralCode) {
      showMsg("Code not ready");
      return;
    }
    const link = "https://t.me/" + BOT_USERNAME + "?startapp=" + userData.referralCode;
    try {
      await navigator.clipboard.writeText(link);
      showMsg("📋 Link copied!");
    } catch (e) {
      showMsg(link);
    }
  });

  // ===================== WITHDRAW =====================
  withdrawBtn.addEventListener("click", async () => {
    if (!currentUser || !userData) {
      showMsg("⏳ Please wait...");
      return;
    }

    const method = document.getElementById("paymentMethod").value;
    const detail = document.getElementById("paymentDetail").value.trim();
    const amount = Number(document.getElementById("withdrawAmount").value);
    const bal = Number(userData.balance || 0);

    if (!detail) {
      showMsg("❌ Enter payment details");
      return;
    }
    if (!amount || amount < 250) {
      showMsg("❌ Minimum ₹250");
      return;
    }
    if (amount > bal) {
      showMsg("❌ Insufficient balance");
      return;
    }

    withdrawBtn.disabled = true;
    showMsg("⏳ Submitting...");

    try {
      await addDoc(collection(db, "withdrawalRequests"), {
        uid: currentUser.uid,
        amount: amount,
        method: method,
        paymentDetail: detail,
        status: "pending",
        createdAt: serverTimestamp()
      });

      await updateDoc(doc(db, "users", currentUser.uid), {
        balance: increment(-amount)
      });

      userData.balance = bal - amount;
      updateUI();

      document.getElementById("paymentDetail").value = "";
      document.getElementById("withdrawAmount").value = "";
      showMsg("✅ Withdrawal request submitted");
    } catch (err) {
      console.error(err);
      showMsg("❌ Failed: " + (err.message || ""));
    }

    withdrawBtn.disabled = false;
  });

  // ===================== START =====================
  signInAnonymously(auth).catch(err => {
    console.error(err);
    statusEl.innerText = "🔴 Auth failed";
    showMsg("❌ Login failed");
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loadUser(user);
    }
  });
</script>
</body>
</html>
