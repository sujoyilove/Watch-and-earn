<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch & Earn</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 32px;
    }

    #balance {
      font-size: 24px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #16803c;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>💰 Watch Ads & Earn</h1>

  <div id="balance">Balance: ₹0.00</div>

  <button id="watchBtn" onclick="watchAd()">▶️ WATCH AD</button>

  <p id="message">Watch ads and earn rewards!</p>

  <script>
    let balance = 0;

    function watchAd() {
      const button = document.getElementById("watchBtn");
      const message = document.getElementById("message");

      button.disabled = true;

      let seconds = 10;

      message.innerText = "📺 Ad playing... " + seconds + " seconds";

      const timer = setInterval(function() {
        seconds--;

        message.innerText =
          "📺 Ad playing... " + seconds + " seconds";

        if (seconds <= 0) {
          clearInterval(timer);

          balance += 0.10;

          document.getElementById("balance").innerText =
            "Balance: ₹" + balance.toFixed(2);

          message.innerText =
            "✅ Ad completed! You earned ₹0.10";

          button.disabled = false;
        }
      }, 1000);
    }
  </script>

</body>
