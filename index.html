<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>

  <!-- Monetag SDK -->
  <script src="//libtl.com/sdk.js"
          data-zone="11563642"
          data-sdk="show_11563642"></script>

  <style>
    body {
      margin: 0;
      padding: 40px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    #balance {
      font-size: 26px;
      font-weight: bold;
      margin: 25px 0;
      color: #16803c;
    }

    #watchBtn {
      width: 100%;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      background: #16803c;
      color: white;
      cursor: pointer;
    }

    #watchBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      font-size: 16px;
      min-height: 25px;
    }

    .notice {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💰 Watch & Earn</h1>

    <div id="balance">
      Balance: ₹0.00
    </div>

    <button id="watchBtn" onclick="watchAd()">
      ▶️ WATCH AD
    </button>

    <div id="message">
      Watch an ad to continue.
    </div>

    <div class="notice">
      Rewards are subject to successful ad completion and platform verification.
    </div>

  </div>

  <script>

    let balance =
      parseFloat(localStorage.getItem("userBalance")) || 0;

    const watchBtn =
      document.getElementById("watchBtn");

    const message =
      document.getElementById("message");

    function updateBalance() {

      document.getElementById("balance").innerText =
        "Balance: ₹" + balance.toFixed(2);

    }

    updateBalance();


    async function watchAd() {

      watchBtn.disabled = true;

      message.innerText =
        "⏳ Opening advertisement...";

      try {

        /*
          Monetag rewarded ad.

          The SDK must be responsible for the
          actual advertisement experience.
        */

        if (typeof show_11563642 !== "function") {

          throw new Error("Monetag SDK not loaded");

        }

        await show_11563642();

        /*
          IMPORTANT:
          Do NOT automatically add ₹3 here.

          A real reward should only be credited
          after a verified reward/completion signal
          from the ad platform/backend.
        */

        message.innerText =
          "✅ Ad finished. Reward verification pending.";

      } catch (error) {

        console.error(error);

        message.innerText =
          "❌ Advertisement could not be completed.";

      }

      watchBtn.disabled = false;

    }

  </script>

</body>
</html>
