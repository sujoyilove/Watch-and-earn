<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>

  <!-- Monetag SDK -->
  <script src="//libtl.com/sdk.js"
          data-zone="11563642"
          data-sdk="show_11563642"></script>

  <style>
    body {
      margin: 0;
      padding: 40px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    #balance {
      font-size: 26px;
      font-weight: bold;
      color: #16803c;
      margin: 25px 0;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .watch {
      background: #16803c;
    }

    .checkin {
      background: #e67e22;
    }

    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
      font-size: 15px;
      font-weight: bold;
    }

    .info {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💰 Watch & Earn</h1>

  <div id="balance">
    Balance: ₹0.00
  </div>

  <button
    id="watchBtn"
    class="btn watch"
    onclick="watchAd()">
    ▶️ WATCH AD
  </button>

  <button
    id="checkinBtn"
    class="btn checkin"
    onclick="dailyCheckIn()">
    📅 DAILY CHECK-IN
  </button>

  <div id="message">
    Watch ads and complete daily check-in to earn rewards.
  </div>

  <div class="info">
    Daily check-in can be claimed once per day.
  </div>

</div>


<script>

  /* =========================
     BALANCE
  ========================= */

  let balance =
    parseFloat(localStorage.getItem("userBalance")) || 0;


  let lastCheckIn =
    localStorage.getItem("lastCheckIn") || "";


  const watchBtn =
    document.getElementById("watchBtn");

  const checkinBtn =
    document.getElementById("checkinBtn");

  const message =
    document.getElementById("message");


  function updateBalance() {

    document.getElementById("balance").innerText =
      "Balance: ₹" + balance.toFixed(2);

  }


  updateBalance();


  /* =========================
     DAILY CHECK-IN STATUS
  ========================= */

  function updateCheckInButton() {

    const today =
      new Date().toDateString();

    if (lastCheckIn === today) {

      checkinBtn.disabled = true;

      checkinBtn.innerText =
        "✅ CHECKED IN TODAY";

    } else {

      checkinBtn.disabled = false;

      checkinBtn.innerText =
        "📅 DAILY CHECK-IN";

    }

  }


  updateCheckInButton();


  /* =========================
     WATCH AD
  ========================= */

  async function watchAd() {

    watchBtn.disabled = true;

    message.innerText =
      "⏳ Opening advertisement...";


    try {

      if (
        typeof show_11563642 !== "function"
      ) {

        throw new Error(
          "Monetag SDK not loaded"
        );

      }


      const event =
        await show_11563642({

          ymid:
            "user-" + Date.now(),

          requestVar:
            "watch_ad"

        });


      console.log(
        "Monetag reward event:",
        event
      );


      if (
        event &&
        event.reward_event_type === "valued"
      ) {

        /*
          TEST REWARD.

          This ₹3 value is only a demo
          until a secure server-side
          reward system is implemented.
        */

        balance += 3.00;


        localStorage.setItem(
          "userBalance",
          balance.toFixed(2)
        );


        updateBalance();


        message.innerText =
          "✅ Ad reward confirmed! ₹3.00 added.";

      } else {

        message.innerText =
          "ℹ️ Ad finished, but no verified reward was received.";

      }


    } catch (error) {

      console.error(
        "Monetag error:",
        error
      );


      message.innerText =
        "❌ Advertisement could not be completed.";

    }


    watchBtn.disabled = false;

  }


  /* =========================
     DAILY CHECK-IN
  ========================= */

  function dailyCheckIn() {

    const today =
      new Date().toDateString();


    if (lastCheckIn === today) {

      message.innerText =
        "ℹ️ You already checked in today.";

      return;

    }


    /*
      TEST REWARD ONLY.
      Daily reward = ₹15.
    */

    balance += 15.00;


    lastCheckIn =
      today;


    localStorage.setItem(
      "userBalance",
      balance.toFixed(2)
    );


    localStorage.setItem(
      "lastCheckIn",
      lastCheckIn
    );


    updateBalance();

    updateCheckInButton();


    message.innerText =
      "🎉 Daily Check-in complete! ₹15.00 added.";

  }

</script>

</body>
</html>
