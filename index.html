<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Watch & Earn</title>

  <!-- Monetag SDK -->
  <script src="//libtl.com/sdk.js"
          data-zone="11563642"
          data-sdk="show_11563642"></script>

  <style>
    body {
      margin: 0;
      padding: 40px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    #balance {
      font-size: 26px;
      font-weight: bold;
      color: #16803c;
      margin: 25px 0;
    }

    #watchBtn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #16803c;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #watchBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
      font-size: 15px;
      font-weight: bold;
    }

    .info {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💰 Watch & Earn</h1>

    <div id="balance">
      Balance: ₹0.00
    </div>

    <button id="watchBtn" onclick="watchAd()">
      ▶️ WATCH AD
    </button>

    <div id="message">
      Watch an ad and earn!
    </div>

    <div class="info">
      Rewards are credited only when a valid rewarded event is received.
    </div>

  </div>

  <script>

    let balance =
      parseFloat(localStorage.getItem("userBalance")) || 0;

    const watchBtn =
      document.getElementById("watchBtn");

    const message =
      document.getElementById("message");


    function updateBalance() {

      document.getElementById("balance").innerText =
        "Balance: ₹" + balance.toFixed(2);

    }


    updateBalance();


    async function watchAd() {

      watchBtn.disabled = true;

      message.innerText =
        "⏳ Opening advertisement...";


      try {

        // Check Monetag SDK
        if (typeof show_11563642 !== "function") {

          throw new Error("Monetag SDK not loaded");

        }


        // Open rewarded advertisement
        const event = await show_11563642({

          ymid: "user-" + Date.now(),

          requestVar: "watch_ad"

        });


        // Show event in browser console for testing
        console.log(
          "Monetag reward event:",
          event
        );


        /*
          Reward only when Monetag reports
          a valued reward event.
        */

        if (
          event &&
          event.reward_event_type === "valued"
        ) {

          /*
            TEST REWARD AMOUNT.

            ₹3 is only a test value here.
            Real payout should later be calculated
            from verified Monetag revenue.
          */

          balance += 3.00;


          localStorage.setItem(
            "userBalance",
            balance.toFixed(2)
          );


          updateBalance();


          message.innerText =
            "✅ Reward confirmed! ₹3.00 added.";


        } else {

          message.innerText =
            "ℹ️ Ad finished, but no verified reward was received.";

        }


      } catch (error) {

        console.error(
          "Monetag error:",
          error
        );


        message.innerText =
          "❌ Advertisement could not be completed.";

      }


      watchBtn.disabled = false;

    }

  </script>

</body>
</html>
